<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניהול תוכן — חסידות גור</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="admin-gate" id="gate">
  <h1>ניהול תוכן — חסידות גור</h1>
  <form id="gate-form">
    <input type="password" id="gate-input" placeholder="קוד גישה" autocomplete="off">
    <button type="submit">כניסה</button>
  </form>
  <div class="admin-gate-error" id="gate-error" hidden>קוד שגוי, נסו שוב.</div>
</div>

<div id="admin-app" hidden>

<header class="app-header">
  <div class="header-inner">
    <img src="icon.svg" alt="" class="header-logo" width="40" height="40">
    <div class="header-text">
      <h1>ניהול תוכן</h1>
      <p class="header-sub">חסידות גור</p>
    </div>
  </div>
</header>

<main id="main">
  <a class="admin-back-link" href="index.html">&#8592; חזרה לאתר</a>
  <div class="admin-load-status" id="load-status">טוען נתונים…</div>

  <section class="tab-panel" data-panel="tefillos">
    <h2 class="section-title">זמני תפילות</h2>
    <div id="tefillos-groups"></div>
    <button type="button" class="admin-btn-add" id="add-group-btn">+ הוספת קבוצת זמנים</button>
    <button type="button" class="admin-btn-save" data-save="tefillos">שמירת זמני תפילות</button>
    <div class="admin-save-status" data-status="tefillos" hidden></div>
  </section>

  <section class="tab-panel" data-panel="kabbalas-kahal" hidden>
    <h2 class="section-title">שעות קבלת קהל</h2>
    <div id="kk-items"></div>
    <button type="button" class="admin-btn-add" id="add-kk-btn">+ הוספת רשומה</button>
    <button type="button" class="admin-btn-save" data-save="kabbalasKahal">שמירת קבלת קהל</button>
    <div class="admin-save-status" data-status="kabbalasKahal" hidden></div>
  </section>

  <section class="tab-panel" data-panel="phonebook" hidden>
    <h2 class="section-title">אלפון</h2>
    <div id="contact-items"></div>
    <button type="button" class="admin-btn-add" id="add-contact-btn">+ הוספת איש קשר</button>
    <button type="button" class="admin-btn-save" data-save="phonebook">שמירת אלפון</button>
    <div class="admin-save-status" data-status="phonebook" hidden></div>
  </section>

  <section class="tab-panel" data-panel="news" hidden>
    <h2 class="section-title">חדשות</h2>
    <div id="news-items"></div>
    <button type="button" class="admin-btn-add" id="add-news-btn">+ הוספת חדשה</button>
    <button type="button" class="admin-btn-save" data-save="news">שמירת חדשות</button>
    <div class="admin-save-status" data-status="news" hidden></div>
  </section>
</main>

<nav class="bottom-nav" id="bottom-nav">
  <button class="nav-btn active" data-tab="tefillos" type="button"><span>תפילות</span></button>
  <button class="nav-btn" data-tab="kabbalas-kahal" type="button"><span>קבלת קהל</span></button>
  <button class="nav-btn" data-tab="phonebook" type="button"><span>אלפון</span></button>
  <button class="nav-btn" data-tab="news" type="button"><span>חדשות</span></button>
</nav>

</div>

<script type="module" src="admin.js"></script>
</body>
</html>
